<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
        }

        .widget-wrap {
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div class="widget-wrap">
        <div name="airvisual_widget" key="66459b61e24094a1c452a6d4"></div>
    </div>
    <script type="text/javascript" src="https://widget.iqair.com/script/widget_v3.0.js"></script>
    <script>
        function scaleWidget() {
            const wrap = document.querySelector('.widget-wrap');
            const widget = wrap.querySelector('[id^="outdoor-widget"]') || wrap.firstElementChild;
            if (!widget || widget.offsetWidth === 0) {
                setTimeout(scaleWidget, 200);
                return;
            }
            const wW = widget.offsetWidth;
            const wH = widget.offsetHeight;
            const vW = window.innerWidth;
            const vH = window.innerHeight;
            const scaleX = vW / wW;
            const scaleY = vH / wH;
            const scale = Math.max(scaleX, scaleY);
            wrap.style.transform = `scale(${scale})`;
        }
        setTimeout(scaleWidget, 1000);
        window.addEventListener('resize', () => setTimeout(scaleWidget, 100));
    </script>
</body>

</html>
